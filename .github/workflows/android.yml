# Build the Android APK (native SDL2; see TOOLS.md → Android build) and
# upload it as a workflow artifact — download it from the run page and
# install it directly on a phone (debug builds are debug-keystore signed).
name: android

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle wrapper is committed (it would be a binary jar in git), so
      # pin the gradle version here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The pinned SDL release sources fetch_deps.sh downloads (~35 MB); keyed
      # on the script so bumping a version there invalidates the cache.
      - uses: actions/cache@v4
        with:
          path: |
            android/app/jni/SDL2
            android/app/jni/SDL2_image
            android/app/jni/SDL2_mixer
            android/app/jni/SDL2_ttf
          key: sdl-android-${{ hashFiles('android/fetch_deps.sh') }}

      # The runner image ships the Android SDK + NDK; make android generates
      # the asset declarations header, fetches SDL, syncs the APK assets and
      # runs gradle assembleDebug.
      - name: Build APK
        run: make android

      - uses: actions/upload-artifact@v4
        with:
          name: tinyadventures-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The apk job proves the APK *builds*. It cannot prove it runs — which is how
  # a manifest naming a nonexistent activity class survived: every artifact
  # built cleanly and died on launch. This job installs it on an emulator and
  # checks it is still alive afterwards (android/emulator_check.sh explains why
  # that is a strong assertion for this app).
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/cache@v4
        with:
          path: |
            android/app/jni/SDL2
            android/app/jni/SDL2_image
            android/app/jni/SDL2_mixer
            android/app/jni/SDL2_ttf
          key: sdl-android-${{ hashFiles('android/fetch_deps.sh') }}

      # EMULATOR=1 adds the x86_64 ABI: the runners are x86_64, and an arm64
      # image on them runs under full software emulation, far too slowly. The
      # shipped APK (the apk job above) stays arm64-only.
      - name: Build APK with the emulator ABI
        run: make android EMULATOR=1

      # The emulator needs hardware acceleration to be usable; GitHub's Linux
      # runners expose /dev/kvm but not to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: android/emulator_check.sh

      - name: Keep the log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore
