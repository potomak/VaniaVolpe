name: Web test (headless browser)

# Gating: builds the WebAssembly target, serves it, and runs the shared
# playthrough scripts (test/scripts/*.json) against it with Puppeteer,
# asserting the expected dialogue appears in the browser console. Screenshots
# taken along the way are uploaded as an artifact.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web target with Emscripten
        # Pinned to match deploy-pages.yml — keep the two in lockstep so the
        # tested toolchain is the deployed toolchain.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.2
          ~/emsdk/emsdk activate 6.0.2
          source ~/emsdk/emsdk_env.sh
          make web

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser-test deps
        working-directory: test/web
        run: npm install

      - name: Run the browser playthroughs
        run: |
          python3 -m http.server 8099 --directory build/web &
          sleep 2
          cd test/web
          for script in ../scripts/*.json; do
            echo "--- $script"
            SHOTS="$GITHUB_WORKSPACE/screenshots/$(basename "$script" .json)" \
              node run_playtest.js "$script"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-screenshots
          path: screenshots/
          if-no-files-found: warn
